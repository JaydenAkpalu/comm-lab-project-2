<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Flip Away</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="panels.css">
  <link rel="stylesheet" href="site.css">
</head>
<body id="top">
  <header class="site-header">
    <h1>One Flip Away</h1>
    <p>A journey through NYU Abu Dhabi, one page at a time.</p>
  </header>
  <main>
    <section class="comic-grid" aria-label="One Flip Away comic panels">
      <figure class="panel">
        <img src="assets/panel-02.png" alt="The student is surprised as his textbook and brochure slip onto the desk." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 1</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-03.png" alt="He opens the NYU Abu Dhabi brochure and studies the campus information." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 2</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-04.png" alt="The brochure seems to pull him into its campus scenes." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 3</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-05.png" alt="He imagines himself among the palm trees on campus." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 4</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-06.png" alt="He arrives at the campus gate and celebrates being there." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 5</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-07.png" alt="The page begins to fade as he wonders whether he belongs." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 6</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-08.png" alt="He explores the D2 dining hall and notices the food options." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 7</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-09.png" alt="Layla sits beside him and introduces herself." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 8</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-10.png" alt="He looks around the library, amazed by the shelves and floating sculptures." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 9</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-11.png" alt="He gets stuck on a problem set while Layla encourages him that nobody does it alone." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 10</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-13.png" alt="Layla reassures him that they can solve the problem together." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 11</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-14.png" alt="He looks up at the skylight and takes a breath." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 12</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-15.png" alt="Later, he and Layla celebrate finishing their work." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 13</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-16.png" alt="The page begins to close as he calls out to Layla." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 14</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-17.png" alt="He closes the brochure, feeling that he belongs where people solve things together." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 15</figcaption>
      </figure>

      <figure class="panel">
        <img src="assets/panel-01.png" alt="Late at night, he returns to studying and faces another difficult problem." loading="lazy" decoding="async">
        <figcaption class="panel-caption">Panel 16</figcaption>
      </figure>
    </section>
  </main>
  <footer class="site-footer">
    <p>One Flip Away · A sixteen-panel comic</p>
    <a href="#top">Back to top</a>
  </footer>
</body>
</html>
